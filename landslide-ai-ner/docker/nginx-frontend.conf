# ============================================================
# Nginx Frontend Config — React SPA
# AI-Based Early Warning & Landslide Risk Monitoring System
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ── React app SPA routing ─────────────────────────────
    # All routes that don't match a physical file fall back to index.html
    # This allows React Router to handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Static assets — long cache ────────────────────────
    # Vite generates content-hashed filenames, so cache indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Manifest and service worker ───────────────────────
    location ~* \.(manifest\.json|sw\.js|workbox-.+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ── Favicon and icons ─────────────────────────────────
    location ~* \.(ico|png|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Deny hidden files ─────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Health check for container orchestration ──────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Error handling ────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
