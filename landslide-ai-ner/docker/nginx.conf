# ============================================================
# Nginx Reverse Proxy Configuration
# AI-Based Early Warning & Landslide Risk Monitoring System
# ============================================================

# ── Upstream servers ──────────────────────────────────────
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:80;
    keepalive 16;
}

# ── Gzip compression ──────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/geo+json
    application/xml
    image/svg+xml
    font/woff2;

# ── Rate limiting zones ───────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Main server block ─────────────────────────────────────
server {
    listen 80;
    server_name _;
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.mapbox.com; \
         connect-src 'self' ws: wss: http://localhost:* https://api.openweathermap.org; \
         frame-src 'none'; \
         object-src 'none';" always;

    # ── CORS headers ──────────────────────────────────────
    add_header Access-Control-Allow-Origin  "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Health check endpoint ─────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"landslide-ner-proxy"}';
        add_header Content-Type application/json;
    }

    # ── API endpoints → FastAPI backend ───────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout  30s;
        proxy_send_timeout     60s;
        proxy_read_timeout     120s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       8k;
        proxy_buffers           8 8k;
        proxy_busy_buffers_size 16k;
    }

    # ── Authentication endpoints (stricter rate limit) ────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket connections (real-time alerts/sensors) ──
    location /ws/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "Upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket-specific timeouts
        proxy_connect_timeout  7d;
        proxy_send_timeout     7d;
        proxy_read_timeout     7d;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ── OpenAPI documentation ─────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Media file serving ────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Restrict allowed file types
        location ~* \.(php|py|sh|exe|bat)$ {
            deny all;
        }
    }

    # ── Static assets → Frontend ──────────────────────────
    location /static/ {
        proxy_pass http://frontend_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── React SPA — all other routes to frontend ──────────
    location / {
        proxy_pass         http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Error pages
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ── Error page ────────────────────────────────────────
    location = /50x.html {
        return 503 '{"error":"Service temporarily unavailable. Please try again shortly."}';
        add_header Content-Type application/json;
    }

    # ── Deny hidden files ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logging ───────────────────────────────────────────
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;
}
